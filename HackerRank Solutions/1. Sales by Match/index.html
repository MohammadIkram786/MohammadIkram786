<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socks Match</title>
</head>

<body>
    <button onclick="sockMerchant(n, ar)">Click Me!</button>
    <script>
        let n = 9;
        let ar = [10, 20, 20, 10, 10, 30, 50, 10, 20]
        function sockMerchant(n, ar) {

            // Step 1: Create an object to store the frequency of each color
            let colorCount = {};

            // Step 2: Count the number of socks for each color
            for (let i = 0; i < n; i++) {
                let color = ar[i];
                if (colorCount[color]) {
                    colorCount[color]++;
                } else {
                    colorCount[color] = 1;
                }
            }

            // Step 3: Calculate the number of pairs
            let totalPairs = 0;
            for (let color in colorCount) {
                totalPairs += Math.floor(colorCount[color] / 2); // Integer division to find pairs
            }

            // Step 4: Return the total number of pairs
            
            console.log(colorCount)
            console.log(totalPairs)
        }

        sockMerchant(n, ar);
    </script>
</body>

</html>
