<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
        let steps = 8;
        let path = 'UDDDUDUU';
        let level = 0
        let valleys = 0
        for (let i = 0; i < steps; i++) {
            if (path[i] === 'U') {
                level++
            }
            else {
                level--
            }

            if (level === 0 && path[i] === 'U') {
                valleys++;
            }
        }
        console.log(valleys)

    </script>
</body>

</html>
