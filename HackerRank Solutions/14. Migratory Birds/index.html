<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
        function migratoryBirds(arr) {
            const birdCounts = {};
            let maxCount = 0;
            let mostFrequentBird = 0;

            for (let i = 0; i < arr.length; i++) {
                const birdId = arr[i];//1
                birdCounts[birdId] = (birdCounts[birdId] || 0) + 1;

                if (birdCounts[birdId] > maxCount) {
                    maxCount = birdCounts[birdId];
                    mostFrequentBird = birdId;
                } else if (birdCounts[birdId] === maxCount && birdId < mostFrequentBird) {
                    mostFrequentBird = birdId;
                }
            }

            return mostFrequentBird;
        }

        // Example usage:
        const arr = [1, 4, 4, 4, 5, 3];
        const result = migratoryBirds(arr);
        console.log(result); // Output: 4
    </script>
</body>

</html>
