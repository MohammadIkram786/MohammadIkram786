<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>
<body>
    <script>
       let arr = [1, 2, 3, -1, -2, -3, 0, 0]
       let negVal = 0, posVal = 0, zero = 0;
       for(let i=0;i<arr.length;i++){
        if(arr[i]>0){
            posVal++
        }
        else if(arr[i]<0){
            negVal++
        }
        else{
            zero++
        }
       }
       const posRat = posVal/arr.length
       const negRat = negVal/arr.length
       const zeroRat = zero/arr.length
       console.log(posRat.toFixed(6), negRat.toFixed(6), zeroRat.toFixed(6))
    </script>
</body>
</html>
