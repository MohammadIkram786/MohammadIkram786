<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socks Match</title>
</head>

<body>
    <div id="block"></div>
    <script>
       let arr = [4,5,3,7,2]
       let small =[];
       let big = [];
       let equal = [];
       arr.filter((v,i)=>{
        if(v<arr[0]){
            small.push(v)
        }
        else if(v>arr[0]){
            big.push(v)
        }
        else{
            equal.push(v)
        }
       })
       small = small.concat(equal, big);
       console.log(small)
    </script>
</body>

</html>
