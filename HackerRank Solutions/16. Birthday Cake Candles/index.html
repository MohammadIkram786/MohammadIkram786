<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
        let arr = [4,4,1,3,5,5,2,5,5];
        let maxVal = Math.max(...arr);
        let count = 0;
        for(let i=0; i<arr.length; i++){
            if(arr[i]===maxVal){
                count++;
            }
        }
        console.log(count)
    </script>
</body>

</html>
