<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
        let arr = [[11,2,4], [4,5,6], [10,8,-12]];
        let firstDig = 0
        let secondDig = 0
        for(let i=0; i<arr.length; i++){
            firstDig += arr[i][i]
        }
        for(let j=0; j<arr.length; j++){
            let val = arr.length-(j+1);
            secondDig += arr[j][val]
        }
        let difference = Math.abs(firstDig-secondDig); //To absolute Value
        console.log(difference)
    </script>
</body>

</html>
