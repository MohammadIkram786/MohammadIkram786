<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
       let arr = [1, 2, 1, 3, 2];
       let day = 3;
       let month = 2;
       let count = 0;

       for(let i=0; i<=arr.length-month; i++){
        let sum = 0;
        for(let j=i; j<i+month; j++){
            sum+=arr[j];
        }
        if(sum===day){
            count++;
        }
       }
       console.log(count)
    </script>
</body>

</html>
