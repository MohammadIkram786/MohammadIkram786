<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socks Match</title>
</head>

<body>
    <div id="block"></div>
    <script>
        const n = 5;
        console.log('Pattern - 1')
        for(let i=1; i<=n; i++){
            let star = '';
            for(let j=n; j>=i; j--){
                star += '*'
            }
            console.log(star)
        }

        console.log('Pattern - 2')
        for(let i=1; i<=n; i++){
            let star = '';
            for(let k=1; k<=i-1; k++){
                star += ' '
            }
            for(let j=n; j>=i; j--){
                star += '*'
            }
            console.log(star)
        }

        console.log('Pattern - 3')
        for(let i=1; i<=n; i++){
            let star = '';
            for(let k=5; k>i; k--){
                star += ' '
            }
            for(let j=1; j<=i; j++){
                star += '*'
            }
            console.log(star)
        }

        console.log('Pattern - 4')
        for(let i=1; i<=n; i++){
            let star = '';
            for(let j=1; j<=i; j++){
                star += '*'
            }
            console.log(star)
        }
    </script>
</body>

</html>
