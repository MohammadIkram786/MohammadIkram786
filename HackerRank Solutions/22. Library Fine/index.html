<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
        function libraryFine(d1, m1, y1, d2, m2, y2) {
            // Case 1: If the book is returned on time or early
            if (y1 < y2 || (y1 === y2 && m1 < m2) || (y1 === y2 && m1 === m2 && d1 <= d2)) {
                return 0;  // No fine
            }

            // Case 2: If returned late within the same year
            if (y1 === y2) {
                if (m1 === m2) {  // Late within the same month
                    return 15 * (d1 - d2);  // Fine per day
                } else if (m1 > m2) {  // Late within the same year, but after the due month
                    return 500 * (m1 - m2);  // Fine per month
                }
            }

            // Case 3: If returned after the due year
            return 10000;  // Fixed fine for returning after the due year
        }

        // Sample usage:
        console.log(libraryFine(9, 6, 2015, 6, 6, 2015));  // Output: 45

    </script>
</body>

</html>
