<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackerRank</title>
</head>

<body>
    <script>
        let arr = [1, 3, 2, 6, 1, 2]
        let k = 3   //Target Divisor Value
        let count = 0
        for(let i=0; i<arr.length; i++){
            for(let j=i+1; j<arr.length; j++){
                if((arr[i]+arr[j])%k===0){
                    count++
                }
            }
        }
        console.log(count)
    </script>
</body>

</html>
