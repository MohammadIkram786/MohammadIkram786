<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socks Match</title>
</head>

<body>
    <div id="block"></div>
    <script>
       let a = [1,2,3,4,5,6,7]
       let b = [6,5,3,4,2,1,0]
       let aScore = 0;
       let bScore = 0;
       let len = a.length;
       for (let i=0;i<len;i++) {
        if (a[i]>b[i]) {
            aScore++; 
        }
        else if (b[i]>a[i]) {
            bScore++;
        }
       }
       console.log(aScore, bScore)
    </script>
</body>

</html>
